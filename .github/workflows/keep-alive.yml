name: Supabase Keep Alive

on:
  schedule:
    # 每隔 3 天的 UTC 时间 0 点执行一次 (防止 7 天休眠)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # 允许你手动点击按钮运行测试

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "https://ozkavfqejloowfhonolz.supabase.co/rest/v1/profiles?select=id&limit=1" \
          -H "apikey: sb_publishable_TuB9JNuMkO7MqhsOwWsPMw_ReueC76y" \
          -H "Authorization: Bearer sb_publishable_TuB9JNuMkO7MqhsOwWsPMw_ReueC76y"
